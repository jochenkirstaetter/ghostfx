<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#161b29"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Code Brackets -->
  <g stroke="url(#ghostGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <path d="M 110 180 L 65 230 L 110 280"/>
    <path d="M 402 180 L 447 230 L 402 280"/>
  </g>

  <!-- Ghost Silhouette -->
  <g filter="url(#glow)">
    <path d="M 256 115 C 185 115 165 170 165 235 C 165 300 150 340 185 360 C 205 373 222 342 238 342 C 248 342 254 360 270 360 C 286 360 296 342 308 342 C 324 342 334 370 350 352 C 365 334 347 285 347 235 C 347 170 327 115 256 115 Z" 
          fill="url(#ghostGrad)" opacity="0.95"/>
    
    <!-- Ghost Eyes -->
    <ellipse cx="228" cy="208" rx="11" ry="15" fill="#0b0e17"/>
    <ellipse cx="284" cy="208" rx="11" ry="15" fill="#0b0e17"/>
    <circle cx="230" cy="204" r="4" fill="#ffffff"/>
    <circle cx="286" cy="204" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Brand Text -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="46" letter-spacing="2" fill="url(#textGrad)">GhostFx</text>
</svg>
