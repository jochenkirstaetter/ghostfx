name: Release GhostFx

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore GhostFx.slnx

      - name: Build
        run: dotnet build GhostFx.slnx --configuration Release --no-restore

      - name: Create NuGet package
        run: |
          dotnet pack GhostFx.Cli/GhostFx.Cli.csproj \
            --configuration Release \
            --output ./artifacts \
            --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-${{ steps.version.outputs.VERSION }}
          path: ./artifacts/*.nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}